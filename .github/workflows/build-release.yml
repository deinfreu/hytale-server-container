name: "Build release"

# Description: Automated CI/CD pipeline triggered by clean version tags (*.*.*).
# 1. Builds and publishes multi-flavor Docker images simultaneously to both GHCR and Docker Hub.
# 2. Automatically compiles a markdown changelog, filters contributors, and deploys a formal GitHub Release.
# 3. Sends a rich release notification directly to Discord via custom cURL once the release succeeded.

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_type: ubuntu
            dockerfile: Dockerfile.ubuntu
            tag_suffix: ""
          - os_type: alpine
            dockerfile: Dockerfile.alpine
            tag_suffix: "alpine"
          - os_type: alpine-liberica
            dockerfile: Dockerfile.alpine-liberica
            tag_suffix: "alpine-liberica"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          raw_tag="${GITHUB_REF#refs/tags/}"
          echo "version=$raw_tag" >> $GITHUB_OUTPUT

      - name: Set tag prefix and latest tag
        id: set_tag
        run: |
          if [ -z "${{ matrix.tag_suffix }}" ]; then
            echo "tag_prefix=" >> $GITHUB_OUTPUT
            echo "latest_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag_prefix=${{ matrix.tag_suffix }}-" >> $GITHUB_OUTPUT
            echo "latest_tag=${{ matrix.tag_suffix }}-latest" >> $GITHUB_OUTPUT
          fi

      # Combined step: builds once and pushes directly to both registries
      - name: Build & Push Images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hytale-server:${{ steps.set_tag.outputs.tag_prefix }}${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/hytale-server:${{ steps.set_tag.outputs.tag_prefix }}${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hytale-server:${{ steps.set_tag.outputs.latest_tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/hytale-server:${{ steps.set_tag.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github_release:
    name: "🚀 Create GitHub Release & Notify"
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag or initial commit
        id: previoustag
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -A1 "${{ github.ref_name }}" | tail -n1 || true)
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "${{ github.ref_name }}" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "Geen eerdere tag gevonden. Fallback naar eerste commit: $PREVIOUS_TAG"
          fi
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog and contributors
        id: changelog
        run: |
          PREVIOUS_TAG="${{ steps.previoustag.outputs.previous_tag }}"
          CURRENT_TAG="${{ github.ref_name }}"
          
          # Run the release notes generator script and capture output
          RELEASE_BODY=$(./scripts/generate-release-notes.sh "$PREVIOUS_TAG" "$CURRENT_TAG")
          
          # Multi-line output escaping for GitHub Actions
          {
            echo 'body<<EOF'
            echo "$RELEASE_BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification via cURL
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.ref_name }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          PAYLOAD=$(jq -n \
            --arg username "Github Release" \
            --arg avatar_url "https://avatars.githubusercontent.com/u/49069598?v=4&size=64" \
            --arg content "I have just released a new version. Version: $RELEASE_NAME is now online!" \
            --arg title "Release $RELEASE_NAME • Changelog & Source Code" \
            --arg url "$RELEASE_URL" \
            --arg description "$RELEASE_BODY" \
            --arg timestamp "$TIMESTAMP" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              content: $content,
              embeds: [{
                author: {
                  name: "GitHub",
                  url: "https://github.com",
                  icon_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                },
                title: $title,
                url: $url,
                description: $description,
                color: 3447003,
                image: {
                  url: "https://raw.githubusercontent.com/deinfreu/hytale-server-container/main/assets/images/logo_dark.png"
                },
                footer: {
                  text: "deinfreu/hytale-server-container",
                  icon_url: "https://avatars.githubusercontent.com/u/49069598?v=4"
                },
                timestamp: $timestamp
              }]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK_URL"