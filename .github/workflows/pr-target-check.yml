name: Enforce PR Target Branch

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-target-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Target Branch
        run: |
          if ("${{ github.base_ref }}" -ne "staging") {
            Write-Error "Pull requests can only target the 'staging' branch. Target branch '${{ github.base_ref }}' is not allowed."
            exit 1
          }
        shell: pwsh