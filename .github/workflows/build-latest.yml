name: "Build latest"

# Description: Manual-only CI/CD pipeline that builds and publishes Docker images
# tagged as "latest" to both GHCR and Docker Hub.

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_type: ubuntu
            dockerfile: Dockerfile.ubuntu
            variant_tag: ""
          - os_type: alpine
            dockerfile: Dockerfile.alpine
            variant_tag: "-alpine"
          - os_type: alpine-liberica
            dockerfile: Dockerfile.alpine-liberica
            variant_tag: "-alpine-liberica"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hytale-server:latest
            ghcr.io/${{ github.repository_owner }}/hytale-server:latest${{ matrix.variant_tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/hytale-server:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/hytale-server:latest${{ matrix.variant_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
