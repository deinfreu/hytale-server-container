name: "Sync Latest Tag"

on:
  release:
    types: [published]

jobs:
  sync-latest:
    name: "Update Latest Tag"
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event.release.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract major version from tag
        id: extract_version
        run: |
          # Extract the major version number from tags like 1.0.0, 2.1.3, etc.
          TAG="${GITHUB_REF#refs/tags/}"
          MAJOR_VERSION=$(echo "$TAG" | cut -d. -f1)
          
          echo "Tag: $TAG"
          echo "Major version: $MAJOR_VERSION"
          
          # Determine the latest minor version for this major release
          LATEST_MINOR=$(git tag --sort=-version:refname --filter="smm:$MAJOR_VERSION.*.*" "$MAJOR_VERSION" 2>/dev/null | head -1 | cut -d. -f2)
          
          if [ -z "$LATEST_MINOR" ]; then
            LATEST_MINOR=0
          fi
          
          echo "Latest minor: $LATEST_MINOR"
          
          # Construct the latest tag for this major release
          LATEST_TAG="$MAJOR_VERSION.$LATEST_MINOR.0"
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Create latest tag if it doesn't exist
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            async function getTagExists(owner, repo, tag) {
              const res = await github.rest.git.getBlob({
                owner,
                repo,
                file_path: 'refs/tags/' + tag
              });
              return res.data?.sha !== null;
            }

            async function main() {
              const { ref } = context.payload;
              const tag = ref.replace('refs/tags/', '');
              
              // Extract major version
              const match = tag.match(/^(\d+)/);
              if (!match) {
                console.log('Tag does not start with a number:', tag);
                return;
              }
              
              const majorVersion = match[1];
              
              // Get all tags with this major version
              const { data: tags } = await github.rest.git.listMatchingRefs({
                owner,
                repo,
                ref: 'tags'
              });
              
              // Find the latest tag for this major version
              const matchingTags = tags.filter(t => {
                const tName = t.name;
                return tName.startsWith(majorVersion + '.') && 
                       !tName.startsWith(majorVersion + '.0.');
              });
              
              if (matchingTags.length === 0) {
                const latestTag = majorVersion + '.0.0';
                console.log('Creating new latest tag:', latestTag);
                
                try {
                  // Try to create the tag pointing to the current commit
                  await github.git.createRef({
                    owner,
                    repo,
                    ref: 'refs/tags/' + latestTag,
                    sha: context.sha
                  });
                  console.log('Created tag:', latestTag);
                } catch (err) {
                  console.error('Failed to create tag:', err.message);
                }
              } else {
                // Sort by version and get the latest
                matchingTags.sort((a, b) => {
                  const aParts = a.name.split('.').map(Number);
                  const bParts = b.name.split('.').map(Number);
                  
                  if (aParts[0] !== bParts[0]) return aParts[0] - bParts[0];
                  if (aParts[1] !== bParts[1]) return aParts[1] - bParts[1];
                  if (aParts[2] !== bParts[2]) return aParts[2] - bParts[2];
                  return 0;
                });
                
                const currentLatest = matchingTags[matchingTags.length - 1].name;
                const newLatest = matchingTags[0].name;
                
                if (currentLatest !== newLatest) {
                  console.log('Updating latest tag from', currentLatest, 'to', newLatest);
                  
                  // Delete the old latest tag
                  try {
                    await github.git.deleteRef({
                      owner,
                      repo,
                      ref: 'refs/tags/' + currentLatest
                    });
                  } catch (err) {
                    console.error('Failed to delete old tag:', err.message);
                  }
                  
                  // Create the new latest tag
                  try {
                    await github.git.createRef({
                      owner,
                      repo,
                      ref: 'refs/tags/' + newLatest,
                      sha: context.sha
                    });
                    console.log('Created new latest tag:', newLatest);
                  } catch (err) {
                    console.error('Failed to create new tag:', err.message);
                  }
                } else {
                  console.log('Latest tag is already up to date:', currentLatest);
                }
              }
            }
            
            await main();
        env:
          GITHUB_REF: ${{ github.ref }}